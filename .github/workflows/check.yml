# ABOUTME: Validates Maven parsing, resolution, and optional editing feature combinations.
# ABOUTME: Builds and tests the feature matrix and runs Clippy with all features.
name: CLI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["", "resolver", "editor", "editor,resolver"]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --verbose --no-default-features --features "${{ matrix.features }}"
      - name: Run tests
        run: cargo test --verbose --no-default-features --features "${{ matrix.features }}"
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clippy
        run: cargo clippy --verbose --all-features
